<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h2 class="text-center mb-3">Sign Up</h2>
            <form method="POST">
                <input type="text" name="username" class="form-control mb-2" placeholder="Choose username" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Choose password" required>
                <button class="btn btn-success w-100">Create Account</button>
            </form>
            <p class="mt-3 text-center"><a href="/login">Already have an account? Login</a></p>
        </div>
    </div>
</body>
</html>
