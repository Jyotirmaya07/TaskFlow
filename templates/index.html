<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #f4f4f4;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .badge {
      font-size: 0.8rem;
    }
    .task-actions i {
      cursor: pointer;
      margin-left: 10px;
      color: #555;
    }
    .task-actions i:hover {
      color: #000;
    }
  </style>
</head>
<body>

<!-- ✅ USER TOP BAR -->
<div class="container d-flex justify-content-between align-items-center my-3">
  <h2>📝 Task Manager</h2>
  <div class="text-end">
    <span class="me-3">👤 {{ username }}</span>
    <a href="/logout" class="btn btn-sm btn-outline-secondary">Logout</a>
  </div>
</div>

<div class="container my-4">

  <!-- Filter Tabs -->
  <div class="d-flex justify-content-center mb-4">
    <a href="/" class="btn btn-outline-dark mx-1">Dashboard</a>
    <a href="/important" class="btn btn-outline-danger mx-1">Important</a>
    <a href="/completed" class="btn btn-outline-success mx-1">Completed</a>
    <a href="/inprogress" class="btn btn-outline-warning mx-1">In Progress</a>
  </div>

  <!-- Task Add Form -->
  <form action="/add" method="POST" class="input-group mb-4">
    <input name="task" class="form-control" placeholder="Enter a new task..." required>
    <select name="importance" class="form-select" style="max-width: 150px;">
      <option value="no">Normal</option>
      <option value="yes">Important</option>
    </select>
    <button class="btn btn-primary">Add</button>
  </form>

  <!-- Task Cards -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for task in tasks %}
    <div class="col">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5>Task {{ loop.index }}</h5>
            <p class="text-muted">{{ task.content }}</p>

            {% if task.is_done %}
              <span class="badge bg-success">Completed</span>
            {% else %}
              <span class="badge bg-warning text-dark">In Progress</span>
            {% endif %}
            {% if task.is_important %}
              <span class="badge bg-danger">Important</span>
            {% endif %}
          </div>

          <div class="task-actions">
            <form action="/toggle/{{ task.id }}" method="POST" style="display:inline;">
              <button class="btn btn-sm btn-outline-secondary" title="Toggle Done">
                <i class="fas fa-check-circle"></i>
              </button>
            </form>
            <a href="/delete/{{ task.id }}" class="btn btn-sm btn-outline-danger" title="Delete Task">
              <i class="fas fa-trash"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

</div>

</body>
</html>
