<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Edit Task</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f4f4f4;
    }

    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>

<div class="container my-5">

  <div class="card p-4">

    <h3 class="mb-4">Edit Task</h3>

    <form action="/edit/{{ task.id }}" method="POST">

      <div class="mb-3">
        <label class="form-label">Task Title</label>

        <input
          type="text"
          name="title"
          class="form-control"
          value="{{ task.title }}"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>

        <textarea
          name="description"
          class="form-control"
          rows="4"
        >{{ task.description or '' }}</textarea>
      </div>

      <div class="row">

        <div class="col-md-4 mb-3">

          <label class="form-label">Priority</label>

          <select name="priority" class="form-select">

            <option value="Low"
              {% if task.priority == 'Low' %}selected{% endif %}>
              Low
            </option>

            <option value="Medium"
              {% if task.priority == 'Medium' %}selected{% endif %}>
              Medium
            </option>

            <option value="High"
              {% if task.priority == 'High' %}selected{% endif %}>
              High
            </option>

          </select>

        </div>

        <div class="col-md-4 mb-3">

          <label class="form-label">Due Date</label>

          <input
            type="date"
            name="due_date"
            class="form-control"
            value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}"
          >

        </div>

        <div class="col-md-4 mb-3">

          <label class="form-label">Category</label>

          <select name="category" class="form-select">

            {% for category in ['Personal', 'College', 'Work', 'Placement', 'Other'] %}

              <option
                value="{{ category }}"
                {% if task.category == category %}selected{% endif %}
              >
                {{ category }}
              </option>

            {% endfor %}

          </select>

        </div>

      </div>

      <div class="mb-4">

        <label class="form-label">Status</label>

        <select name="status" class="form-select">

          <option value="To Do"
            {% if task.status == 'To Do' %}selected{% endif %}>
            To Do
          </option>

          <option value="In Progress"
            {% if task.status == 'In Progress' %}selected{% endif %}>
            In Progress
          </option>

          <option value="Completed"
            {% if task.status == 'Completed' %}selected{% endif %}>
            Completed
          </option>

        </select>

      </div>

      <button type="submit" class="btn btn-primary">
        Save Changes
      </button>

      <a href="/" class="btn btn-secondary">
        Cancel
      </a>

    </form>

  </div>

</div>

</body>
</html>
